# 双端构建与发布（Wails v3）
# 触发：tag v* 或手动 Run workflow
# 资产命名含平台+架构，对齐 updater.findAsset（macos|windows + arm64|x86_64）
#
# Windows 签名顺序（SignPath）：
#   build exe → 签 exe → 用已签名 exe 打 NSIS → 签 installer → 发布
# Secrets 未配时跳过签名，仍产出未签名包。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '标签名（手动触发用，如 v1.1.0）'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '24'

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        id: ver
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VER="${TAG#v}"
          CODE=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go | head -1)
          # 取 info.version（顶层 version 是 Wails 配置 schema，不是应用版本）
          CFG=$(awk '/^info:/{f=1;next} f && /^[^[:space:]#]/{exit} f && /^[[:space:]]+version:/{gsub(/["'\'']/,""); print $2; exit}' build/config.yml)
          echo "tag=${TAG} expected=${VER} code=${CODE} config=${CFG}"
          if [ -z "$CODE" ] || [ -z "$CFG" ]; then
            echo "::error::无法读取 Version / config.yml version"
            exit 1
          fi
          if [ "$VER" != "$CODE" ]; then
            echo "::error::tag 版本 ${VER} ≠ internal/version.Version=${CODE}"
            exit 1
          fi
          if [ "$CODE" != "$CFG" ]; then
            echo "::error::Version=${CODE} ≠ build/config.yml version=${CFG}"
            exit 1
          fi
          echo "version=${CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Task + Wails3
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package (.app, ad-hoc sign)
        run: task package

      - name: Zip for Release
        run: |
          set -euo pipefail
          mkdir -p dist-release
          case "$(uname -m)" in
            arm64) LABEL=arm64 ;;
            x86_64) LABEL=x86_64 ;;
            *) LABEL="$(uname -m)" ;;
          esac
          OUT="WPSEnhancer-macos-${LABEL}.zip"
          test -d bin/wps-enhancer-go.app
          (cd bin && zip -r -y "../dist-release/${OUT}" "wps-enhancer-go.app")
          ls -la dist-release/

      - uses: actions/upload-artifact@v4
        with:
          name: go-macos
          path: dist-release/*.zip
          if-no-files-found: error

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Task + Wails3
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Windows exe
        shell: bash
        run: |
          set -euo pipefail
          task build
          test -f bin/wps-enhancer-go.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-exe
          path: bin/wps-enhancer-go.exe
          if-no-files-found: error

  sign-app-exe:
    needs: build-windows
    runs-on: ubuntu-latest
    outputs:
      signpath: ${{ steps.cfg.outputs.enabled }}
    steps:
      - name: Detect SignPath configuration
        id: cfg
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ -n "${SIGNPATH_API_TOKEN}" ] && [ -n "${SIGNPATH_ORGANIZATION_ID}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SignPath secrets detected"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SignPath secrets not set; Windows builds stay unsigned (docs/signpath-setup.md)"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: windows-unsigned-exe
          path: unsigned

      - name: Upload app exe for SignPath
        if: steps.cfg.outputs.enabled == 'true'
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: signpath-app-exe-in
          path: unsigned/wps-enhancer-go.exe

      - name: Sign app exe
        if: steps.cfg.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'wps-enhancer-go' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: windows-app-exe
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Stage signed or unsigned app exe
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${{ steps.cfg.outputs.enabled }}" = "true" ]; then
            if [ -f signed/wps-enhancer-go.exe ]; then
              cp signed/wps-enhancer-go.exe out/
            else
              find signed -type f -print || true
              zipf=$(find signed -name '*.zip' -print -quit || true)
              if [ -n "${zipf}" ]; then
                unzip -o "${zipf}" -d signed-extract
                cp signed-extract/wps-enhancer-go.exe out/
              else
                exe=$(find signed -name 'wps-enhancer-go.exe' -print -quit || true)
                test -n "${exe}"
                cp "${exe}" out/
              fi
            fi
          else
            cp unsigned/wps-enhancer-go.exe out/
          fi
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app-exe
          path: out/wps-enhancer-go.exe
          if-no-files-found: error

  build-installer:
    needs: sign-app-exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install Task + Wails3 + NSIS
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          choco install nsis -y --no-progress
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
          echo 'C:\Program Files (x86)\NSIS\Bin' >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          name: windows-app-exe
          path: bin

      - name: Build NSIS from (signed) exe
        shell: bash
        run: |
          set -euo pipefail
          test -f bin/wps-enhancer-go.exe
          command -v makensis
          makensis -VERSION
          # 不 rebuild：嵌入的是已签名 exe
          task windows:create:nsis:installer:from-bin
          INST=$(ls bin/*-installer.exe 2>/dev/null | head -1 || true)
          if [ -z "${INST}" ]; then
            echo "::error::未找到 NSIS 安装器 bin/*-installer.exe"
            exit 1
          fi
          cp "${INST}" bin/WPSEnhancer-windows-x86_64-installer.exe
          ls -la bin/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-installer
          path: bin/WPSEnhancer-windows-x86_64-installer.exe
          if-no-files-found: error

  sign-installer:
    needs: [sign-app-exe, build-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Detect SignPath configuration
        id: cfg
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ -n "${SIGNPATH_API_TOKEN}" ] && [ -n "${SIGNPATH_ORGANIZATION_ID}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: windows-app-exe
          path: app

      - uses: actions/download-artifact@v4
        with:
          name: windows-unsigned-installer
          path: installer

      - name: Upload installer for SignPath
        if: steps.cfg.outputs.enabled == 'true'
        id: upload-inst
        uses: actions/upload-artifact@v4
        with:
          name: signpath-installer-in
          path: installer/WPSEnhancer-windows-x86_64-installer.exe

      - name: Sign installer
        if: steps.cfg.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'wps-enhancer-go' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: windows-installer-exe
          github-artifact-id: ${{ steps.upload-inst.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Package go-windows release assets
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp app/wps-enhancer-go.exe dist-release/
          (cd dist-release && zip -j WPSEnhancer-windows-x86_64.zip wps-enhancer-go.exe)
          rm -f dist-release/wps-enhancer-go.exe

          if [ "${{ steps.cfg.outputs.enabled }}" = "true" ]; then
            if [ -f signed/WPSEnhancer-windows-x86_64-installer.exe ]; then
              cp signed/WPSEnhancer-windows-x86_64-installer.exe dist-release/
            else
              find signed -type f -print || true
              zipf=$(find signed -name '*.zip' -print -quit || true)
              if [ -n "${zipf}" ]; then
                unzip -o "${zipf}" -d signed-extract
                cp signed-extract/WPSEnhancer-windows-x86_64-installer.exe dist-release/
              else
                inst=$(find signed -name 'WPSEnhancer-windows-x86_64-installer.exe' -print -quit || true)
                test -n "${inst}"
                cp "${inst}" dist-release/
              fi
            fi
          else
            cp installer/WPSEnhancer-windows-x86_64-installer.exe dist-release/
          fi
          ls -la dist-release/

      - uses: actions/upload-artifact@v4
        with:
          name: go-windows
          path: dist-release/*
          if-no-files-found: error

  release:
    needs: [verify-version, build-macos, sign-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: go-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-version.outputs.tag }}
          name: WPS Enhancer Go v${{ needs.verify-version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
          token: ${{ secrets.GITHUB_TOKEN }}

      # 用户更新主源：公开仓 my-software-releases（需配置 secret GITEE_TOKEN）
      - name: Publish to Gitee my-software-releases
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "跳过：未配置 secret GITEE_TOKEN（见 docs/gitee-releases.md）"
            exit 0
          fi
          chmod +x scripts/publish-gitee.sh
          # CI 常重打同一版本 tag：Gitee 侧需 --force 覆盖已有 Release
          bash scripts/publish-gitee.sh \
            --version "${{ needs.verify-version.outputs.version }}" \
            --assets-dir artifacts \
            --force \
            --notes "WPS Enhancer v${{ needs.verify-version.outputs.version }}"
