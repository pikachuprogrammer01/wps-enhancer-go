# 双端构建与发布（Wails v3）
# 触发：tag v* 或手动 Run workflow
# 资产命名含平台+架构，对齐 updater.findAsset（macos|windows + arm64|x86_64）
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '标签名（手动触发用，如 v1.1.0）'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '24'

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        id: ver
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VER="${TAG#v}"
          CODE=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go | head -1)
          # 取 info.version（顶层 version 是 Wails 配置 schema，不是应用版本）
          CFG=$(awk '/^info:/{f=1;next} f && /^[^[:space:]#]/{exit} f && /^[[:space:]]+version:/{gsub(/["'\'']/,""); print $2; exit}' build/config.yml)
          echo "tag=${TAG} expected=${VER} code=${CODE} config=${CFG}"
          if [ -z "$CODE" ] || [ -z "$CFG" ]; then
            echo "::error::无法读取 Version / config.yml version"
            exit 1
          fi
          if [ "$VER" != "$CODE" ]; then
            echo "::error::tag 版本 ${VER} ≠ internal/version.Version=${CODE}"
            exit 1
          fi
          if [ "$CODE" != "$CFG" ]; then
            echo "::error::Version=${CODE} ≠ build/config.yml version=${CFG}"
            exit 1
          fi
          echo "version=${CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Task + Wails3
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package (.app, ad-hoc sign)
        run: task package

      - name: Zip for Release
        run: |
          set -euo pipefail
          mkdir -p dist-release
          case "$(uname -m)" in
            arm64) LABEL=arm64 ;;
            x86_64) LABEL=x86_64 ;;
            *) LABEL="$(uname -m)" ;;
          esac
          OUT="WPSEnhancer-macos-${LABEL}.zip"
          test -d bin/wps-enhancer-go.app
          (cd bin && zip -r -y "../dist-release/${OUT}" "wps-enhancer-go.app")
          ls -la dist-release/

      - uses: actions/upload-artifact@v4
        with:
          name: go-macos
          path: dist-release/*.zip
          if-no-files-found: error

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Task + Wails3 + NSIS
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          choco install nsis -y --no-progress
          # windows-latest 不会自动刷新 choco 写入的 PATH；须用 Windows 路径写 GITHUB_PATH
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
          echo 'C:\Program Files (x86)\NSIS\Bin' >> "$GITHUB_PATH"

      - name: Package (NSIS)
        shell: bash
        run: |
          set -euo pipefail
          command -v makensis
          makensis -VERSION
          task package

      - name: Stage Windows assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          ls -la bin/
          INST=$(ls bin/*-installer.exe 2>/dev/null | head -1 || true)
          if [ -z "${INST}" ]; then
            echo "::error::未找到 NSIS 安装器 bin/*-installer.exe"
            exit 1
          fi
          cp "${INST}" "dist-release/WPSEnhancer-windows-x86_64-installer.exe"
          if [ -f bin/wps-enhancer-go.exe ]; then
            # windows-latest 无 zip；用 PowerShell Compress-Archive
            powershell.exe -NoProfile -Command \
              "Compress-Archive -Path 'bin/wps-enhancer-go.exe' -DestinationPath 'dist-release/WPSEnhancer-windows-x86_64.zip' -Force"
          fi
          ls -la dist-release/

      - uses: actions/upload-artifact@v4
        with:
          name: go-windows
          path: dist-release/*
          if-no-files-found: error

  release:
    needs: [verify-version, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-version.outputs.tag }}
          name: WPS Enhancer Go v${{ needs.verify-version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
          token: ${{ secrets.GITHUB_TOKEN }}

      # 用户更新主源：公开仓 my-software-releases（需配置 secret GITEE_TOKEN）
      - name: Publish to Gitee my-software-releases
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "跳过：未配置 secret GITEE_TOKEN（见 docs/gitee-releases.md）"
            exit 0
          fi
          chmod +x scripts/publish-gitee.sh
          bash scripts/publish-gitee.sh \
            --version "${{ needs.verify-version.outputs.version }}" \
            --assets-dir artifacts \
            --notes "WPS Enhancer v${{ needs.verify-version.outputs.version }}"
